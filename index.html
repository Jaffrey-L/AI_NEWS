<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 周读 · 原文可查的每周解读</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261111-weekly-focus">
</head>
<body>
  <div class="bg"></div>
  <header class="hero shell">
    <div>
      <span class="eyebrow">AI WEEKLY READING · ORIGINAL SOURCES</span>
      <h1>AI 周读</h1>
      <p>每周先读一篇有判断的解读。重点追踪核心 AI 博主与大公司的原文；观点下方可查发布日期、引文与原始链接。</p>
    </div>
    <div class="badges">
      <span>按周追踪解读</span>
      <span>原文可追溯</span>
      <span>历史按周阅读</span>
    </div>
  </header>

  <section class="shell opinion" aria-label="AI 每周解读">
    <div class="opinion-head">
      <div>
        <span class="eyebrow small">WEEKLY INTERPRETATION · SOURCE LINKED</span>
        <h2>每周解读</h2>
      </div>
      <div class="opinion-controls">
        <label for="weekSelect">阅读周次</label>
        <select id="weekSelect" aria-label="选择历史周次"></select>
      </div>
    </div>
    <p id="opinionMeta" class="opinion-meta" role="status">正在读取每周解读…</p>
    <article id="opinionArticle" class="opinion-article" aria-live="polite"></article>
    <nav id="weekArchive" class="week-archive" aria-label="历史解读"></nav>
    <p class="week-archive-note">仅展示已核到足够原文的周次；资料不足的周次留空。</p>
  </section>

  <script src="./app.js?v=20261111-weekly-focus"></script>
</body>
</html>
