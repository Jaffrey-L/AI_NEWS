name: Refresh AI and Amazon editions
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Refresh {0} {1}', inputs.mode, inputs.request_id) || github.event.head_commit.message || 'Publish AI_NEWS' }}

on:
  push:
    branches: [main, server-refresh]
  workflow_dispatch:
    inputs:
      mode:
        description: Edition to refresh
        required: true
        type: choice
        options: [amazon, weekly]
      request_id:
        description: Server trigger commit for matching the completed run
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-editions
  cancel-in-progress: false

jobs:
  dispatch_from_server:
    if: >-
      github.event_name == 'push' && github.ref_name == 'server-refresh' && startsWith(github.event.head_commit.message, 'server-refresh: ')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the refresh on main
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ github.event.head_commit.message }}
          MARKER_SHA: ${{ github.sha }}
        run: |
          case "$MARKER" in
            'server-refresh: amazon '*) mode=amazon ;;
            'server-refresh: weekly '*) mode=weekly ;;
            *) echo 'Invalid server refresh marker' >&2; exit 1 ;;
          esac
          gh workflow run refresh-editions.yml --repo "$GITHUB_REPOSITORY" --ref main --field mode="$mode" --field request_id="$MARKER_SHA"

  refresh:
    if: github.ref_name != 'server-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and validate issue
        id: refresh
        if: github.event_name == 'workflow_dispatch'
        env:
          AI_NEWS_PROVIDER: deepseek
          AI_NEWS_MODEL: deepseek-flash
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set +e
          python scripts/run_auto_update.py --mode "$INPUT_MODE"
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Publish validated data or failure notice
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published AI news data'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public site only
        run: |
          mkdir -p public/data
          cp index.html app.js workspace.css public/
          cp data/site-payload.js public/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag failed refresh
        if: github.event_name == 'workflow_dispatch' && steps.refresh.outputs.result != '0'
        run: exit 1
